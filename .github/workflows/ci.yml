name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # The integration suite migrates and tests against a real Postgres —
    # same major version as docker-compose.yml and production.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The harness uses TEST_DATABASE_URL verbatim (and refuses any database
      # whose name does not end in "test"); DATABASE_URL is what the spawned
      # prisma CLI and any future app-level steps read.
      DATABASE_URL: postgresql://studio:studio@localhost:5432/studio_test?schema=public
      TEST_DATABASE_URL: postgresql://studio:studio@localhost:5432/studio_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated, not committed, so everything after this
      # step depends on it existing.
      - run: pnpm db:generate

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
